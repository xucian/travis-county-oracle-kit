  permit_contact_privacy_classification:
    contractor_fields: [contractor_trade, contractor_company_name, contractor_full_name, contractor_phone, contractor_address1, contractor_address2, contractor_city, contractor_zip]
    contractor_classification: business contact fields printed on a public building-permit record; kept as printed as source-name attribution; never identity; phone never feeds identity matching; reversible before hosting
    applicant_fields: [applicant_full_name, applicant_org, applicant_phone, applicant_address1, applicant_address2, applicant_city, applicantzip]
    applicant_classification: personal contact fields; not collected, not stored, stripped from fixtures
