lexicon_gaps:
  - id: lexicon-gap-county-enum
    detail: unnormalized_address.county_jurisdiction (required) and address.county_name enums lack Travis (lexicon#194, docs/travis-lexicon-county-enum-request.md). Not a validation blocker (assignment decisions.md section 22, 2026-10-17); the Seed root is address_has_parcel only, address.county_name is omitted and no unnormalized_address is written, so the archive validates against the live manifest; no field in it names the county (the Atlas page, the run record and the README manifest do)
  - id: lexicon-gap-geo-id
    detail: geo_id has no lexicon home; kept in source_payload on property and permit
  - id: lexicon-gap-permit-product-fields
    detail: description, printed status_current, expiresdate and contractor fields have no property_improvement home; kept in source_payload (decisions.md section 5 option ii, else iii)
  - id: lexicon-gap-business-registration
    detail: no corporate-registry data group among the live manifest's 16 groups; company holds only name, request_identifier, source_http_request and sunbiz_document_number (additionalProperties false); Business_Location is the places shape. Franchise, sales-tax and veteran-owned rows stay internal and reach the API as unpublished_source business_records (decisions.md section 23)
  - id: lexicon-gap-license
    detail: the live manifest (2026-10-17, 159 entries, sha256 7084b933...) has no license class and no company-to-license relationship (property_improvement_to_company and company_to_person exist); no license record or contractor_has_license edge is written and no other edge is substituted

approved_exceptions:
  # Only an entry whose gate is exactly a validator gate name (parcel, permit, ...) is read by the
  # validator. Entries with any other gate value are inactive or awaiting the operator's approval.
  - gate: parcel
    status: approved-by-operator
    proposed_at: "2026-10-16"
    approval_action: The operator approves by changing this gate to parcel and this status to approved-by-operator (one command in docs/runbook.md of the assignment repository); until then the validator keeps the parcel gate BLOCKED and no seed is built.
    reason: The assessed-roll denominator is canonical; the material GIS gap is expected for separately assessed condominium units without unique polygons, and the seed is built from the TCAD certified export, not from GIS.
    cause: 57,567 condominium accounts (A4 54,675, F4 2,892) have no polygon of their own in the TNR layer (0 of 40 sampled found), plus recent splits not yet in the monthly TNR assembly (C1 16 of 20 sampled found); 13,130 polygons carry no PROP_ID.
    canonical_denominator: 441,961 real-property accounts (distinct prop_id with prop_type_cd R) in the TCAD 2026 certified export, supplement 0
    seed_decision: one seed row per real-property account from the TCAD export; the TNR layer supplies a polygon and centroid only where a polygon carries the account's PROP_ID; never seed from GIS
    excluded_population: none among real-property accounts; MH (11,744), P (39,536) and MN (5) accounts are outside the parcel population because they are not land parcels
    coverage_effect: accounts without their own polygon (at least the 57,567 condo units) carry no parcel coordinates; radius search reaches them only through a later condo-to-regime join or permit coordinates, reported as a coverage number and never geocoded
  - gate: parcel-gis-only-contingency
    status: not-active
    activation: Move this entry to gate parcel only if the operator declines the TCAD export purchase; until then the parcel gate blocks on the pending counts.
    reason: If the TCAD export is declined or geo-blocked for the whole window, the TNR parcel layer attributes become the parcel roll (cause - TCAD paywall or geo-block; canonical denominator - the assessed roll count read from TCAD if available, else the layer count with the discrepancy reported; seed decision - seed from the layer; excluded population - separately_assessed_without_geometry acknowledged, condominium units sharing polygons are kept as rows without unique geometry; coverage effect - year built and deed dates become documented gaps unless another official source provides them).
