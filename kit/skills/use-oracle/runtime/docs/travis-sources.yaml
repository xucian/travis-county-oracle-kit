parcel:
  canonical_source: TCAD 2026 Certified Appraisal Export (PACS Legacy 8.0.33 fixed-width layout, supplement 0, run 2026-07-18) - real-property accounts
  canonical_source_url: https://traviscad.org/wp-content/largefiles/2026%20Certified%20Appraisal%20Export%20Supp%200_07182026.zip
  canonical_source_access: free direct download from https://traviscad.org/publicinformation (HTTP 200, no login, no fee, no account); 557,228,168 bytes, sha256 62d0d1cd22b03f31db8d3986160eb181c5d00044df98a303fce9e17a44e9aa02, downloaded 2026-10-16 under US egress
  layout_url: https://traviscad.org/wp-content/largefiles/Website_Legacy8.0.33-AppraisalExportLayout_06182026.zip
  improvement_detail_source: IMP_DET.TXT inside the certified export (3,310,160 detail records, 400,963 properties); the separate March 2026 "Improvement Details Report 2026" CSV (https://traviscad.org/wp-content/largefiles/improvement_detail_2026.zip, free) is pre-certification and not used for the seed
  tax_roll_year: 2026
  tax_roll_status: certified (supplement 0); later supplemental roll exports exist (Supp 335 of 2026-10-08) and feed incremental runs
  assessed_parcel_count: 441961
  assessed_count_basis: distinct prop_id with prop_type_cd R in PROP.TXT (442,039 R records; 78 are additional partial-owner records of the same accounts). Not parcels and excluded from this denominator - 11,744 MH mobile-home accounts (their geo_id is the host parcel's), 39,536 P business-personal-property accounts, 5 MN mineral accounts. PROP.TXT holds 493,324 records, all 2026, all sup_num 0, record length 9922.
  gis_source: Travis County TNR "TCAD Parcels" layer, Boundaries_and_Jurisdictions/TCAD_public MapServer layer 0 (assembled monthly by TNR from TCAD; fields OBJECTID, PROP_ID integer, geo_id, situs fields, hyperlink, CENTROID_X/Y; maxRecordCount 2000; the FeatureServer endpoint is not enabled - "Server object extension 'featureserver' not found")
  gis_source_url: https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/TCAD_public/MapServer/0
  gis_feature_count: 386682
  gis_count_basis: returnCountOnly on MapServer layer 0 with where 1=1 (2026-10-16); 13,130 of the polygons carry no PROP_ID, so 373,552 polygons carry an account id
  discrepancy_threshold_pct: 2.0
  discrepancy_pct: 12.51
  discrepancy_explanation: GIS is 55,279 below the assessed real-property accounts (12.51%). Condominium accounts have no polygon of their own - the regime's land polygon carries none of the unit accounts - 57,567 accounts are condos (state code A4 condos 54,675 plus F4 commercial condos 2,892), and 0 of 40 sampled condo PROP_IDs (20 A4, 20 F4) exist in the layer, while 20 of 20 sampled A1 single-family PROP_IDs do. Of the vacant lots (C1) 16 of 20 sampled exist, consistent with recent splits not yet in the monthly TNR assembly. The remaining non-condo gap (384,394 non-condo accounts against 373,552 polygons with an account id, about 2.8%) is measured exactly by the seed join (gisJoined, gisUnjoined, rowsWithGeometry in the seed manifest).
  separately_assessed_without_geometry: acknowledged
  identifier_proven: true
  identifier_evidence: 5 PROP_IDs from the export (379828 A1, 583669 A4, 182212 C1, 506701 F1, 237985 B2) resolved on the TCAD property search https://travis.prodigycad.com/property-detail/<PROP_ID> on 2026-10-16 under US egress with the same Geographic ID, type R, state code and situs as the export rows (docs/evidence/travis-identifier-spot-check-2026-10-16.json); 4 of the 5 also exist in the TNR layer with the same geo_id (the condo does not)
  identifier_name: Property ID (PROP_ID)
  identifier_format: decimal integer as TCAD's property search, the TNR layer (esriFieldTypeInteger) and the layer's hyperlink print it (for example 379828). The export field is int(12) fixed width and zero-padded (000000379828); the padding is the integer field's encoding, not part of the identifier, and is removed when the field is decoded.
  secondary_identifier_name: Geographic ID (geo_id)
  secondary_identifier_format: char(50) printed as a 10-digit string with leading zeros (for example 0282360106) on every R and MH record; Austin permits print it as tcad_id. 1,164 geo_ids are shared by several real accounts (431,536 distinct geo_ids for 441,961 real accounts), so an exact geo_id permit link can have several candidates and stays unlinked as multiple_candidates.
  join_rule: Treat PROP_ID and geo_id as text after decoding; PROP_ID is the seed parcel_id, the lexicon parcel_identifier and the kit request_identifier; permits link to parcels on geo_id exactly as printed; digits-only comparison only after the profile proves it one-to-one over the roll
  appraisal_access_method: bulk
  appraisal_safe_throughput: n/a (bulk files); TNR paging at concurrency 1 with a 0.5 s delay, 1,000 features per request (about 387 requests)
  geometry_fallbacks:
    - county GIS parcel shapefile download if the service blocks paging
    - City of Austin parcel layer
    - permit latitude/longitude for parcels with no geometry (secondary; reported as a coverage number; never geocoded)

