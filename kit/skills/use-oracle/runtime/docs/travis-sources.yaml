parcel:
  canonical_source: TCAD 2026 Certified Appraisal Export (assessed tax roll; PACS appraisal-export layout)
  canonical_source_url: https://traviscad.org/publicinformation
  canonical_source_access: bulk download under US egress; cost not stated on the page; a paid file is a human payment decision
  tax_roll_year: 2026
  tax_roll_status: certified (July 2026) plus supplemental roll exports
  assessed_parcel_count: null
  gis_source: Travis County TNR parcel layer, Boundaries_and_Jurisdictions/TCAD_public FeatureServer layer 0 (fields include PROP_ID and geo_id; 1000 features per request)
  gis_source_url: https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/TCAD_public/FeatureServer/0
  gis_feature_count: null
  counts_pending: Both counts are read during the US egress window; until then the parcel gate stays BLOCKED by design and no seed, smoke, pilot or full ingest runs.
  discrepancy_threshold_pct: 2.0
  discrepancy_explanation: pending both counts; condominium and other separately assessed units share polygons, so GIS is expected below the assessed roll
  separately_assessed_without_geometry: acknowledged
  identifier_proven: false
  identifier_name: Property ID (PROP_ID)
  identifier_format: integer-like string as printed by the roll; leading zeros preserved if any
  secondary_identifier_name: Geographic ID (geo_id)
  secondary_identifier_format: 10-digit string as printed (for example 0222210299); Austin permits print it as tcad_id
  join_rule: Treat PROP_ID and geo_id as text; PROP_ID is the seed parcel_id, the lexicon parcel_identifier and the kit request_identifier; permits link to parcels on geo_id exactly as printed; digits-only comparison only after the profile proves it one-to-one over the roll
  appraisal_access_method: bulk
  appraisal_safe_throughput: n/a (bulk files); TNR paging at concurrency 1-2
  geometry_fallbacks:
    - county GIS parcel shapefile download if the service blocks paging
    - City of Austin parcel layer
    - permit latitude/longitude for parcels with no geometry (secondary; reported as a coverage number; never geocoded)

permits:
  expected_jurisdiction_count: 23
  assumes_unified_countywide_history: false
  permit_authority_boundary: City of Austin (full purpose, limited purpose and ETJ rows in the Socrata export), 21 other incorporated cities and villages wholly or partly in Travis County, and unincorporated Travis County (development permits only; Texas counties have no building-permit authority)
  delegated_jurisdictions: none; the small-city rows inside the Austin export are Austin-issued trade permits (EP/MP/PP from 1980, building permits ending around 2005), not those cities' ledgers
  excluded_places:
