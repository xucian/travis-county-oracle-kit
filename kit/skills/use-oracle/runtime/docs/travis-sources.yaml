source_inventory:
  property_appraisal_bulk: https://traviscad.org/publicinformation
  property_geometry: https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/TCAD_public/FeatureServer/0
  permits_bulk: https://data.austintexas.gov/resource/3syk-w9eu
  permits_detail: https://abc.austintexas.gov/web/permit/public-search-other
  corporate_registry_official: Texas Secretary of State (SOSDirect, paid)
  corporate_registry_exception: https://data.texas.gov/resource/9cir-efmm (Comptroller Active Franchise Tax Permit Holders)
  licensing_electrical_hvac: https://www.tdlr.texas.gov/LicenseSearch/
  licensing_plumbing: https://www.tsbpe.texas.gov/
  bbb: https://www.bbb.org/ (not contacted from this machine)
  lexicon_manifest: https://lexicon.elephant.xyz/api/manifest

destination:
  writes_in_scope: false
  proven: false
  mode: v1 internal working store is the elephant-county reconcile-export output (Parquet and coverage JSON) under the gitignored runtime data/ directory; no DATABASE_URL, no Query DB writes until v2
  private_artifact_boundary: runtime data/ and the operator's scratch directories; never an MCP or publication source

publication:
  status: pilot-upload-planned-no-atlas-pr
  registry: atlas
  county_page: counties/TX/travis.json
  data_groups_v1:
    - county
  data_groups_later:
    - property_improvement
  public_artifacts:
    - validated CAR per data group
    - CLI-exported normalized tables per data group
  upload_node: Filebase over Kubo RPC (rpc.filebase.io); the CLI reads FILEBASE_ACCESS_KEY, FILEBASE_SECRET_KEY and FILEBASE_BUCKET
  credentials_note: the operator's git-ignored .env carries FILEBASE_ACCESS_TOKEN (mapped onto FILEBASE_ACCESS_KEY by the runbook) and FILEBASE_SECRET_KEY; FILEBASE_BUCKET is still to be set; values are never printed
  atlas_pr: not in v1

enrichment:
  bbb:
    status: blocked-access-request-drafted
    source_access_status: blocked
    source_access_complete: false
    incomplete_reason: http_403_source_block
    probe_policy: single bounded probe only from the approved AWS US-egress runtime (operator_machine false); nothing from this machine
    access_request: docs/travis-bbb-access-request.md
    observed_coverage: 0_percent
  corporate_registry:
    status: pending-us-egress
    official_source: Texas Secretary of State (paid; human payment decision)
    exception_source: Texas Comptroller Active Franchise Tax Permit Holders (data.texas.gov 9cir-efmm)
    semantics: registry candidates only; never identity; the live lexicon has no corporate_registry group and company carries only sunbiz_document_number, so rows stay in the internal store
  licensing:
    status: pending-us-egress
    authorities: [TDLR (electrical, HVAC), TSBPE (plumbing)]
    roofing_license: none issued by Texas (recorded gap)
    permit_license_numbers: the Austin export prints none, so no license lookup key exists

lexicon_gaps:
  - id: lexicon-gap-county-enum
    detail: unnormalized_address.county_jurisdiction (required) and address.county_name enums lack Travis; request drafted in docs/travis-lexicon-county-enum-request.md; blocks elephant-cli validate until merged
  - id: lexicon-gap-geo-id
    detail: geo_id has no lexicon home; kept in source_payload on property and permit
  - id: lexicon-gap-permit-product-fields
    detail: description, printed status_current, expiresdate and contractor fields have no property_improvement home; kept in source_payload (decisions.md section 5 option ii, else iii)

approved_exceptions:
  - gate: corporate-registry
    reason: The official Texas corporate registry (Secretary of State) is paid; the Comptroller Active Franchise Tax Permit Holders file is used as the registry candidate source, loads candidates only (never identity), and the SOS purchase stays a human payment decision recorded in the run record.
  - gate: parcel-gis-only-contingency
    status: not-active
    activation: Move this entry to gate parcel only if the operator declines the TCAD export purchase; until then the parcel gate blocks on the pending counts.
    reason: If the TCAD export is declined or geo-blocked for the whole window, the TNR parcel layer attributes become the parcel roll (cause - TCAD paywall or geo-block; canonical denominator - the assessed roll count read from TCAD if available, else the layer count with the discrepancy reported; seed decision - seed from the layer; excluded population - separately_assessed_without_geometry acknowledged, condominium units sharing polygons are kept as rows without unique geometry; coverage effect - year built and deed dates become documented gaps unless another official source provides them).
