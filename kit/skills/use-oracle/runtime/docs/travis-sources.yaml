official_identity:
  # Assignment decisions.md section 23 (approved by the operator on 2026-10-17). Loaded before any permit harvest
  # (onboard-county stage 6). Rows are official records of their own subjects; a link from a permit contractor or a
  # roll owner to a row is a review candidate (exact unique normalized name), never identity, and writes no company,
  # person or license record and no identity edge.
  corporate_registry:
    profile_entry: official-registry-equivalent
    approved_by: operator
    approved_at: "2026-10-17"
    approval_record: assignment repository docs/decisions.md section 23 (supersedes the corporate-registry approved exception of 2026-10-16, removed from approved_exceptions)
    equivalent_source: Texas Comptroller of Public Accounts, Active Franchise Taxpayers (data.texas.gov 9cir-efmm), the official state record of each franchise-tax entity, carrying the Secretary of State registry key
    equivalent_source_url: https://data.texas.gov/resource/9cir-efmm
    authority_of_record: Texas Secretary of State; SOSDirect (paid subscriber access) stays an optional human payment decision, not required for v1
    record_keys: taxpayer_number and secretary_of_state_sos_or_coa_file_number, both as printed (the trimmed values are the keys; the printed values are kept beside them)
    registry_key_coverage_travis: SOS file number on 335,956 of 342,334 Travis rows of 2026-10-17 (98.14%), with sos_status_code, sos_charter_date, sos_status_date and right_to_transact_business_code; the 6,378 rows without one are record_type_code X
    columns: 18 (taxpayer number, name, mailing address, city, state, ZIP, mailing county code, organizational type, record type, responsibility beginning date, SOS or COA file number, SOS charter date, SOS status date, SOS status code, right-to-transact code, current exempt reason code, exempt begin date, NAICS code printed under the field name _621111)
    limits:
      - no registered agent, officers or other filing roles
      - no assumed names
      - no entity outside franchise tax (sole proprietors and general partnerships of natural persons are not franchise taxpayers; the Comptroller's sales-tax permit file is loaded for those, see further_business_sources)
      - active taxpayers only, so no ended accounts and no history
      - taxpayer_county_code is the mailing-address county, not a business location; 31 taxpayers statewide print two rows (one in Travis, SOS status A of 2001 and R of 2003)
    scope: Travis load = taxpayer_county_code 227, derived from the statewide capture (342,334 rows on 2026-10-17 = 342,333 taxpayers + 1 explained duplicate); the statewide file (3,487,662 rows, 3,487,631 taxpayers, rowsUpdatedAt 2026-10-17T10:35:29Z) is the private matching universe, and out-of-county rows enter business_records only as matched candidates of a Travis permit or roll owner, flagged by scope
    travis_delta_2026_10_16_to_2026_10_17: 290 new, 1,418 changed, 340,625 unchanged, 294 tombstoned (232 now under another mailing county in the statewide file, 62 gone from it)
    provenance: each row keeps its bulk capture (request as sent, fetched_at, page SHA-256, offset, row SHA-256); the bulk dataset page is never written as a company's source_http_request
    detail_url: travis-comptroller-detail-url.v1 - https://comptroller.texas.gov/taxes/franchise/account-status/search/<taxpayer_number> for franchise rows with an 11-digit number (HTTP 200, no redirect, a page generated for that taxpayer under US egress on 2026-10-17); null for sales-tax and veteran-owned rows and for withheld numbers; the page renders the record in the browser from https://comptroller.texas.gov/data-search/franchise-tax/<taxpayer_number> (not requested), so the URL is a link, never provenance (docs/evidence/travis-t3-detail-url-2026-10-17.json)
    publication: not eligible for IPFS in v1 - the live manifest has no corporate-registry data group and company holds only name, request_identifier, source_http_request and the Florida sunbiz_document_number under additionalProperties false; rows stay on the internal registry track and reach the hosted API only as the deploy-time source-shaped business_records table, labelled unpublished_source per row
    status: travis-and-statewide-loaded-2026-10-17 (window run 20261017T160716Z, every receipt verified)
    snapshot: runtime data/travis/registry/ (private Parquet tx-comptroller-franchise-tax-statewide and tx-comptroller-franchise-tax-travis, normalizer travis-t3-source-snapshot.v1, the 2026-10-16 snapshot kept under history/) and the registry-track watermark; evidence docs/evidence/travis-t3-franchise-load-2026-10-17.json
  licensing:
    approved_by: operator
    approved_at: "2026-10-17"
    approval_record: assignment repository docs/decisions.md section 23
    roofing_license: none
    roofing_license_note: Texas issues no state roofing license; RCAT's credential is voluntary and is enrichment at most
    permit_license_numbers: none printed - the Austin export has 68 named columns (82 in the Socrata catalog with 4 location sub-fields and 10 computed regions), none license-related; license markers appear in free text on 14 of about 2.38 million rows and in no contractor field (docs/evidence/travis-t3-absence-proofs-2026-10-17.json)
    historical_qualification: closed for v1 by the operator on 2026-10-17 - the README does not ask for it, Texas has no roofing license and no public file carries the dated license-holder-to-business relationship; no records requests are filed and the gap is listed under limitations
    candidate_rule: a name match to a license row is a license_candidate (exact unique normalized name), never identity; no license record and no contractor_has_license edge (the live manifest has no license class and no company-to-license relationship; the gap is recorded and no other edge is substituted)
    sources:
      - key: tdlr-license-files
        authority: Texas Department of Licensing and Regulation (electrical and air conditioning/refrigeration licenses)
        source: TDLR daily license files (CSV), URLs resolved at run time from https://www.tdlr.texas.gov/LicenseSearch/licfile.asp
        data_texas_gov_copy: 7358-krk7 (TDLR - All Licenses; data updated 2026-09-19; not used, the daily files are newer)
        column_set: tdlr-licfile-columns.v1 (one 23-column header in all 16 files; any other header stops the load)
        csv_dialect: unescaped-quotes (TDLR does not escape quotes inside quoted values; 4 rows in 3 files)
        permit_roles: tdlr-permit-role.v1 - contractor licenses (Electrical Contractor, Electrical Sign Contractor, A/C Contractor, Appliance Installation Contractor; 35,981 statewide, 1,251 with a Travis business county) can back a permit's listed contractor; masters (20,487) qualify an electrical contractor; journeymen, apprentices, technicians, wiremen and installers (403,254) work under one; CE providers (271) hold no trade license
        personal_contact_columns: mailing address lines and the licensee phone stay in the private snapshot and are never served
        status: captured and loaded 2026-10-17 - 16 files, 887,715 rows, 459,993 licenses (docs/evidence/travis-t3-licensing-load-2026-10-17.json)
      - key: tsbpe-responsible-master-plumber
        authority: Texas State Board of Plumbing Examiners
        source: free licensee lists, the Responsible Master Plumber CSV with the last known company, https://tsbpe.texas.gov/download-csv/RMP/ (link "Responsible Master Plumber List" on https://tsbpe.texas.gov/free-licensee-list/)
        columns: 23 printed (LICENSE_NBR the key, FIRST/MIDDLE/LAST_NAME the licensee, PLUMB_COMPANY the company; INSURANCE_COMPANY is the insurer, not a company role); ADDR1-3, CITY, STATE, ZIP and PHONE are the licensee's own contact fields, kept private and never served
        status: captured 2026-10-17 (window run 20261017T192341Z, after the first run saved the site menu's description page) and loaded - 9,378 licenses, 278 in Travis (kit 7b84696)
      - key: austin-row-contractor-licenses
        authority: City of Austin Transportation and Public Works
        source: Active Right of Way Contractor License Holders (data.austintexas.gov 8d92-wsiw; 5 columns; 469 rows captured 2026-10-17, data updated 2026-10-17T07:05:35Z)
        status: captured and loaded 2026-10-17 (docs/evidence/travis-t3-austin-row-2026-10-17.json)
  further_business_sources:
    - key: tx-comptroller-sales-tax
      source: Texas Comptroller Active Sales Tax Permit Holders (data.texas.gov jrea-zgmq; outlet addresses, outlet county, NAICS, permit and first-sale dates, entity types outside franchise tax)
      scope: Travis outlets, outlet_county_code 227 (read from the dataset's grouped codes at fetch time)
      privacy: travis-t3-privacy.v2 - taxpayer_organization_type IS (INDIVIDUAL - SOLE OWNER) and S (SOLE PROPRIETORSHIP, 0 Travis rows), the two sole-owner types of both record layouts, are individual_owner; PI, PZ, ES and TR stay visible (entities with their own numbers, decisions.md section 24.4); its taxpayer number is withheld from every derived store (null in the snapshot, row hash over the row with that cell emptied) and never served; 9,471 of 49,025 outlets; no number in the capture has the SSN-based leading 2 and neither layout mentions SSNs, but every sole-owner number is withheld whatever its form; record ids (assignment decisions.md section 24.2) - business_record_id of a withheld row is the keyed travis-record-id.v1 digest (HMAC-SHA256 under the record-id key, fingerprint a85dc5bf94154a97, over taxpayer and outlet number), row_sha256 the hash of the row with the number emptied
      status: loaded 2026-10-17 - 49,025 outlets of 42,216 taxpayers, rowsUpdatedAt 2026-10-17T10:31:10Z (docs/evidence/travis-t3-sales-tax-load-2026-10-17.json)
    - key: tx-sos-veteran-owned-business
      source: Texas Secretary of State Veteran Owned Business (data.texas.gov 2vfr-72e4)
      scope: statewide file captured (27,205 rows, dataset of 2026-10-01); the Travis subset is the 2,343 rows joined to a Travis franchise row
      join_key: travis-sos-file-number-join.v1 - the franchise file prints the SOS file number zero-padded to 10 digits, the veteran file 9 digits, so printed equality joins none; the key restores the padding (25,466 joined; the veteran file's taxid agrees with the joined taxpayer number on 24,868); ruled by the operator on 2026-10-17 as the exact SOS file number (assignment decisions.md section 24.1)
      status: loaded and joined 2026-10-17 (docs/evidence/travis-t3-veteran-owned-load-2026-10-17.json)
  record_layouts:
    approved_by: operator
    approved_at: "2026-10-17"
    approval_record: assignment repository docs/decisions.md section 24.4
    source: the record layouts attached to jrea-zgmq ("Active Sales Tax Permit Record Layout.pdf", asset c1cf06f3-4a69-4489-b1c7-84de30a269d8 in the metadata of 2026-10-17) and 9cir-efmm ("Franchise Layout.docx", asset 297f2282-33fe-4e7b-86de-10f6ae5f07e3), resolved at fetch time from each dataset's metadata (the captured metadata when that request fails), from https://data.texas.gov/api/views/<id>/files/<assetId>, the asset endpoint as fallback
    purpose: confirm the organization codes and taxpayer number forms the privacy rule relies on
    offline_check: node --max-old-space-size=16384 src/counties/travis/t3-load.mjs --only layouts (travis-t3-layout-check.v1; consistent, differs, partial, unreadable or awaiting_capture)
    status: captured 2026-10-17 (window run 20261017T192341Z) and checked - consistent with travis-t3-privacy.v2 (79 codes, the same table in both; sole-owner codes IS and S; no SSN mentioned; no visible number with the leading 2); docs/evidence/travis-t3-record-layouts-2026-10-17.json
    window_command: cd /Users/luti/dev/ateam/role1-prism/kit-travis/skills/use-oracle/runtime && node src/counties/travis/t3-vpn-fetch.mjs --only tsbpe-responsible-master-plumber,comptroller-record-layouts (resumable)
  matcher:
    version: travis-exact-unique-normalized-name.v1
    indexes: runtime data/travis/matcher/ (travis-t3-name-index.v1); franchise universe statewide - 3,450,553 normalized names, 33,159 shared; Travis alone 628 shared; 336,439 Travis taxpayers hold a statewide-unique name, 5,891 a shared one (docs/evidence/travis-t3-name-index-2026-10-17.json)
  window_fetch: node src/counties/travis/t3-vpn-fetch.mjs (runtime directory; checks egress before every request, stops on non-US; assignment docs/runbook.md section 5); run of record 20261017T160716Z (US at all 104 checks, 103 requests, 170 s)
